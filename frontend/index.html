<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="description" content="Premier hub for ethical hackers and security researchers to share, learn, and defend" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SecTube" />

    <title>SecTube - Security Streaming Platform</title>
  </head>
  <body>
    <div id="root">
      <!-- Initial Loading Screen -->
      <div id="initial-loader" style="position: fixed; inset: 0; background-color: #0a0e1a; display: flex; align-items: center; justify-content: center; z-index: 9999;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
          <!-- Logo -->
          <img src="/logo.png" alt="SecTube" style="height: 60px; width: auto; opacity: 0; animation: fadeIn 0.5s ease-in forwards;" />

          <!-- Animated Spinner -->
          <div style="position: relative; width: 80px; height: 80px;">
            <!-- Outer ring -->
            <div style="position: absolute; inset: 0; width: 80px; height: 80px; border: 4px solid rgba(59, 130, 246, 0.2); border-top-color: rgb(59, 130, 246); border-radius: 50%; animation: spin 1s linear infinite;"></div>

            <!-- Inner ring -->
            <div style="position: absolute; inset: 8px; width: 64px; height: 64px; border: 4px solid rgba(59, 130, 246, 0.3); border-top-color: transparent; border-radius: 50%; animation: spin 1.5s linear infinite reverse;"></div>

            <!-- Center icon -->
            <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
              <div style="width: 24px; height: 24px; background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(59, 130, 246, 0.1)); border-radius: 4px; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
            </div>
          </div>

          <!-- Loading dots -->
          <div style="display: flex; gap: 6px;">
            <div style="width: 8px; height: 8px; background-color: rgb(59, 130, 246); border-radius: 50%; animation: bounce 1s infinite;" data-delay="0"></div>
            <div style="width: 8px; height: 8px; background-color: rgb(59, 130, 246); border-radius: 50%; animation: bounce 1s infinite;" data-delay="0.15s"></div>
            <div style="width: 8px; height: 8px; background-color: rgb(59, 130, 246); border-radius: 50%; animation: bounce 1s infinite;" data-delay="0.3s"></div>
          </div>
        </div>
      </div>

      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
          to { opacity: 1; }
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }

        @keyframes bounce {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }

        div[data-delay="0.15s"] {
          animation-delay: 0.15s;
        }

        div[data-delay="0.3s"] {
          animation-delay: 0.3s;
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Remove initial loader once React loads -->
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.3s ease-out';
            setTimeout(() => loader.remove(), 300);
          }
        }, 500);
      });
    </script>
  </body>
</html>

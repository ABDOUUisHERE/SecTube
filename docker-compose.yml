services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "1935:1935"
    env_file:
      - ./backend/.env
    volumes:
      - backend-uploads:/app/uploads
      - backend-videos:/app/videos
      - backend-thumbnails:/app/thumbnails
      - backend-avatars:/app/avatars
      - backend-streams:/app/streams
    restart: unless-stopped
    networks:
      - sectube-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sectube-network

networks:
  sectube-network:
    driver: bridge

volumes:
  backend-uploads:
  backend-videos:
  backend-thumbnails:
  backend-avatars:
  backend-streams:
